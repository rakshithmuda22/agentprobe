name: "AgentProbe — AI Code Governance"
description: "Deterministic AST-based PR governance — no LLM judge, no per-PR API cost"
inputs:
  github_token:
    description: "GitHub token for API access"
    required: true
  style_profile_path:
    description: "Path to style profile"
    default: ".agentprobe/style-profile.yaml"
runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GITHUB_TOKEN: ${{ inputs.github_token }}
    STYLE_PROFILE_PATH: ${{ inputs.style_profile_path }}
