[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "1.0.0"
description = "Deterministic PR governance GitHub Action: architecture boundaries, naming/forbidden-pattern rules and behavior-change detection, orchestrated with LangGraph. No LLM, no API keys."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"  # tree-sitter-languages has no 3.13 wheels
dependencies = [
    "langgraph>=0.2.0",
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.10.0",
    "PyGithub>=2.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "hypothesis>=6.98.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agentprobe = "agentprobe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Language\\(path, name\\) is deprecated:FutureWarning"]
