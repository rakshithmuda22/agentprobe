# Self-hosted webhook server (alternative to the GitHub Action).
#   GITHUB_TOKEN=... GITHUB_WEBHOOK_SECRET=... docker compose up --build
services:
  webhook:
    build: .
    entrypoint: ["uvicorn", "agentprobe.integrations.webhook_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:?set GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET}
