naming:
  functions: snake_case
  classes: PascalCase
  files: snake_case
imports:
  order: [builtin, external, internal, relative]
forbidden:
  - name: no-print-in-analyzers
    pattern: '^\s*print\('
    files: "src/agents/*_agent.py"
    message: Analyzers return findings; they don't print
  - name: no-eval
    pattern: '\beval\('
    severity: FATAL
    message: eval() on repository content is never allowed
